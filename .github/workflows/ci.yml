name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build CAPEF frontend
        run: PORT=19100 BASE_PATH=/ pnpm --filter @workspace/capef run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Test CAPEF frontend
        run: pnpm --filter @workspace/capef run test

      - name: Test API server
        run: pnpm --filter @workspace/api-server run test

      - name: API Spec Drift Check
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-zod lib/api-client-react
